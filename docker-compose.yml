version: '3.8'

services:
  neo:
    build: .
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=qwen2.5:3b
      - PORT=3000
      - NEO_DOMAIN=neo.z-node.cc
      - NEO_PASSWORD=${NEO_PASSWORD}
      - NEO_SESSION_SECRET=${NEO_SESSION_SECRET}
      - NEO_MONTHLY_BUDGET=${NEO_MONTHLY_BUDGET:-10}
      - NEO_TELEGRAM_CHAT_ID=${NEO_TELEGRAM_CHAT_ID:-}
    ports:
      - "3200:3000"
    networks:
      - supabase_default

networks:
  supabase_default:
    external: true
